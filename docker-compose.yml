services:
  wings:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wings-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - PORT=8080
      - WORKSPACE_DIR=/app/workspace
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-https://psftggepxuhjulszeruv.supabase.co}
      - VITE_SUPABASE_PUBLISHABLE_KEY=${VITE_SUPABASE_PUBLISHABLE_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - MAIL_FROM=${MAIL_FROM:-Wings Personal OS <notifications@ahsen.aeolus.dev>}
      - APP_URL=${APP_URL:-https://wings.aeolus.dev}
    volumes:
      # Persistent workspace on your Contabo server disk:
      - ./workspace:/app/workspace
